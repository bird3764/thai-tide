name: อัปเดตข้อมูลน้ำขึ้นน้ำลง (TideCheck)

on:
  schedule:
    - cron: "30 0 * * *"    # 07:30 น. เวลาไทย (หลังโควตารายวันรีเซ็ต) วันละครั้ง
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-tides.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ดึงข้อมูลจาก TideCheck
        env:
          TIDECHECK_KEY: ${{ secrets.TIDECHECK_KEY }}
        run: |
          node <<'JS'
          const fs = require("fs");
          const STATIONS = [
            {n:"สมุทรปราการ (พระสมุทรเจดีย์)", lat:13.5976, lon:100.5972},
            {n:"กรุงเทพฯ (คลองเตย)",       lat:13.70, lon:100.55},
            {n:"นนทบุรี (ท่าน้ำนนท์)",     lat:13.85, lon:100.51},
            {n:"ฉะเชิงเทรา (บางปะกง)",     lat:13.45, lon:100.97},
            {n:"ชลบุรี (ศรีราชา)",      lat:13.12, lon:100.90},
            {n:"พัทยา",                 lat:12.90, lon:100.83},
            {n:"ระยอง",                 lat:12.62, lon:101.35},
            {n:"ตราด (แหลมงอบ)",        lat:12.10, lon:102.35},
            {n:"เพชรบุรี (บ้านแหลม)",      lat:13.08, lon:100.07},
            {n:"หัวหิน",                lat:12.55, lon:100.05},
            {n:"ประจวบคีรีขันธ์",        lat:11.80, lon: 99.85},
            {n:"ชุมพร",                 lat:10.50, lon: 99.35},
            {n:"สุราษฎร์ธานี (ดอนสัก)",  lat: 9.25, lon: 99.85},
            {n:"นครศรีธรรมราช",          lat: 8.35, lon:100.35},
            {n:"สงขลา",                 lat: 7.25, lon:100.65},
            {n:"ปัตตานี",               lat: 7.00, lon:101.35},
            {n:"นราธิวาส",              lat: 6.45, lon:102.00},
            {n:"ระนอง",                 lat: 9.90, lon: 98.40},
            {n:"พังงา",                 lat: 8.35, lon: 98.20},
            {n:"ภูเก็ต",                lat: 7.85, lon: 98.20},
            {n:"กระบี่ (อ่าวนาง)",       lat: 7.95, lon: 98.85},
            {n:"สตูล (ปากบารา)",         lat: 6.80, lon: 99.60},
          ];
          const KEY = process.env.TIDECHECK_KEY;
          const BASE = process.env.TC_BASE || "https://tidecheck.com/api";
          const DATUM = process.env.TC_DATUM || "LAT";
          const MAXREQ = +(process.env.MAX_REQUESTS || 45);   // กันไม่ให้เกินโควตาฟรี 50 ต่อวัน
          if (!KEY) { console.error("ไม่พบ secret TIDECHECK_KEY"); process.exit(1); }
          const DAY = 864e5;
          let used = 0;

          async function api(path) {
            if (used >= MAXREQ) throw new Error("ถึงเพดาน " + MAXREQ + " คำขอแล้ว หยุดเพื่อไม่ให้เกินโควตา");
            used++;
            const r = await fetch(BASE + path, {headers: {"X-API-Key": KEY}});
            const txt = await r.text();
            if (!r.ok) throw new Error("HTTP " + r.status + " " + txt.slice(0, 200));
            try { return JSON.parse(txt); } catch (e) { throw new Error("อ่าน JSON ไม่ได้: " + txt.slice(0, 200)); }
          }
          function parseTime(s) {
            if (typeof s === "number") return s > 1e12 ? s : s * 1000;
            s = String(s).trim().replace(" ", "T");
            const tz = /(Z|[+-]\d{2}:?\d{2})$/i.test(s.slice(10));
            return Date.parse(tz ? s : s + "Z");
          }
          function collectExtremes(j) {
            const typed = [], any = [];
            (function walk(o) {
              if (Array.isArray(o)) { o.forEach(walk); return; }
              if (o && typeof o === "object") {
                const h = o.height ?? o.height_m, tm = o.time ?? o.datetime ?? o.dt;
                if (typeof h === "number" && tm != null) {
                  const t = parseTime(tm);
                  if (isFinite(t)) { any.push({t, h}); if (typeof o.type === "string" && /^(high|low)/i.test(o.type)) typed.push({t, h}); }
                  return;
                }
                Object.values(o).forEach(walk);
              }
            })(j);
            if (typed.length >= 6) return dedupe(typed);          // ใช้เฉพาะรายการที่ระบุว่า high/low
            return denseToExtremes(dedupe(any));                   // เผื่อ API ส่งมาแต่ค่ารายเวลา
          }
          function denseToExtremes(a) {
            if (a.length < 8) return a;
            const gaps = []; for (let i = 0; i < a.length-1; i++) gaps.push(a[i+1].t - a[i].t);
            gaps.sort((x, y) => x - y);
            if (gaps[gaps.length >> 1] > 100*60e3) return a;       // เว้นช่วงห่างอยู่แล้ว = เป็นจุดน้ำขึ้นลงจริง
            const out = [];
            for (let i = 1; i < a.length-1; i++) {
              const p = a[i-1].h, b = a[i].h, n = a[i+1].h;
              if ((b > p && b >= n) || (b < p && b <= n)) {
                const last = out[out.length-1], hi = b > p;
                if (last && last.hi === hi && a[i].t - last.t < 3*3600e3) { if (hi ? b > last.h : b < last.h) out[out.length-1] = {t:a[i].t, h:b, hi}; }
                else out.push({t:a[i].t, h:b, hi});
              }
            }
            return out.map(({t, h}) => ({t, h}));
          }
          function dedupe(a) {
            a.sort((x, y) => x.t - y.t);
            const out = [];
            a.forEach(e => { if (!out.length || e.t - out[out.length-1].t > 60000) out.push(e); });
            return out;
          }
          function findStations(o, acc) {
            if (Array.isArray(o)) { o.forEach(x => findStations(x, acc)); return; }
            if (o && typeof o === "object") {
              if (o.id != null && o.name != null) acc.push(o);
              Object.values(o).forEach(v => { if (v && typeof v === "object") findStations(v, acc); });
            }
          }
          const readJson = (f, d) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { return d; } };

          (async () => {
            fs.mkdirSync("data", {recursive: true});
            const map = readJson("data/stations.json", {});          // จำสถานีอ้างอิงไว้ จะได้ไม่เสียโควตาหาซ้ำ
            let old = readJson("data/tides.json", {stations: []});
            if (old.format !== 2) old = {stations: []};              // ไฟล์จากเวอร์ชันเก่า (มีจุดซ้ำซ้อน) ไม่เอา
            const out = []; let ok = 0, kept = 0;

            for (const s of STATIONS) {
              const key = s.lat + "," + s.lon;
              const prev = (old.stations || []).find(x => x.lat === s.lat && x.lon === s.lon);
              // พยากรณ์ล่วงหน้า 14 วัน ถ้าสถานีนี้ยังมีข้อมูลเหลือเกิน 8 วัน ไม่ต้องเสียโควตาดึงใหม่
              if (prev && prev.ex && prev.ex.length && prev.ex[prev.ex.length-1].t > Date.now() + 8*DAY) {
                out.push(Object.assign({}, prev, {ex: prev.ex.filter(e => e.t > Date.now() - 2*DAY)}));
                console.log("ข้าม", s.n, "(ข้อมูลเดิมยังพอ)"); kept++; continue;
              }
              try {
                if (!map[key]) {
                  const j = await api(`/stations/nearest?lat=${s.lat}&lng=${s.lon}`);
                  const found = []; findStations(j, found);
                  if (!found.length) throw new Error("หาสถานีใกล้ไม่เจอ: " + JSON.stringify(j).slice(0, 300));
                  const dist = x => x.distance ?? x.distanceKm ?? x.distance_km ?? x.dist ?? Infinity;
                  found.sort((a, b) => dist(a) - dist(b));
                  const f = found[0];
                  map[key] = {id: f.id, name: f.name, distance: isFinite(dist(f)) ? dist(f) : null};
                  fs.writeFileSync("data/stations.json", JSON.stringify(map, null, 1));
                  console.log("สถานีอ้างอิง", s.n, "->", f.name, "(id " + f.id + ", ห่าง", map[key].distance, ")");
                }
                const m = map[key];
                const j = await api(`/station/${encodeURIComponent(m.id)}/tides?days=14&datum=${DATUM}`);
                const ex = collectExtremes(j);
                if (ex.length < 6) throw new Error("ได้จุดน้ำขึ้นลงน้อยเกินไป: " + JSON.stringify(j).slice(0, 300));
                // เก็บข้อมูลเมื่อวานจากรอบก่อนไว้ เพราะแพ็กเกจฟรีขอย้อนหลังไม่ได้ (ใช้วาดกราฟช่วงเช้ามืดของวันนี้)
                const keepOld = ((prev && prev.ex) || []).filter(e => e.t < ex[0].t - 30*60e3 && e.t > Date.now() - 2*DAY);
                out.push({n: s.n, lat: s.lat, lon: s.lon,
                          ref: m.name + (m.distance != null ? " (ห่าง " + Math.round(m.distance * 10) / 10 + " กม.)" : ""),
                          ex: keepOld.concat(ex)});
                ok++; console.log("OK", s.n, ex.length, "จุด");
              } catch (e) {
                console.log("ล้มเหลว", s.n, "-", e.message);
                if (prev) out.push(prev);                               // ใช้ข้อมูลเดิมไปก่อน
              }
              await new Promise(r => setTimeout(r, 500));
            }
            console.log("ใช้โควตาไป", used, "คำขอ");
            if (!ok && !kept) { console.error("ดึงข้อมูลไม่ได้เลยสักสถานี (ดูข้อความด้านบน)"); process.exit(1); }
            fs.writeFileSync("data/tides.json", JSON.stringify({format: 2, updated: new Date().toISOString(), provider: "TideCheck", datum: DATUM, stations: out}));
            console.log("บันทึก data/tides.json แล้ว: ดึงใหม่", ok, "สถานี รวม", out.length, "/", STATIONS.length);
          })();
          JS
      - name: บันทึกไฟล์ข้อมูล
        run: |
          git config user.name "tide-bot"
          git config user.email "tide-bot@users.noreply.github.com"
          git add data/tides.json data/stations.json
          git diff --cached --quiet || (git commit -m "Update tide data" && git push)
