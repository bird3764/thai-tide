<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06101e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ระดับน้ำทะเลไทย</title>
<style>
  :root{
    --bg:#06101e; --panel:#0e1d33; --line:#1a3052; --text:#eaf2ff; --dim:#8aa0c2;
    --accent:#1e8cff; --hi:#78dcff; --lo:#ffbe78;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  body{display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;gap:8px;padding:12px 12px 8px}
  .select-wrap{flex:1;position:relative;min-width:0}
  select{width:100%;appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:12px;padding:12px 36px 12px 14px;font-size:16px;font-family:inherit}
  .select-wrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;
    border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  select:focus-visible,.dbtn:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
  .chart-row{flex:1;display:flex;gap:8px;min-height:300px}
  #strip{flex:none;width:78px;display:flex;flex-direction:column;gap:6px}
  .dbtn{flex:1;min-height:40px;background:var(--panel);color:#cfe0fa;border:1px solid var(--line);border-radius:12px;
    padding:2px 0;font-family:inherit;font-size:12px;line-height:1.25;cursor:pointer}
  .dbtn b{display:block;font-size:14px;font-weight:600}
  .dbtn span{display:block;opacity:.85}
  .dbtn.on{background:#145a96;border-color:#2f86d0;color:#fff}
  .dbtn:active{filter:brightness(1.25)}
  main{flex:1;display:flex;flex-direction:column;padding:0 12px 12px;gap:10px;max-width:760px;width:100%;margin:0 auto}
  .chart-wrap{position:relative;flex:1;min-width:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;display:block}
  #status{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;
    font-size:15px;background:rgba(6,16,30,.75)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .card .k{font-size:12px;color:var(--dim)}
  .card .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .card .s{font-size:12px;color:var(--dim)}
  .hi .v{color:var(--hi)} .lo .v{color:var(--lo)}
  .tides{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-variant-numeric:tabular-nums}
  .chip b{color:var(--hi)} .chip.l b{color:var(--lo)}
  footer{font-size:11px;color:var(--dim);line-height:1.5;padding:2px 2px 0}
  footer a{color:var(--dim)}
  @media (prefers-reduced-motion:reduce){ }
</style>
</head>
<body>
<header>
  <div class="select-wrap">
    <select id="station" aria-label="เลือกจุดวัด"></select>
  </div>
</header>

<main>
  <div class="chart-row">
    <div class="chart-wrap">
      <canvas id="cv" aria-label="กราฟระดับน้ำทะเล"></canvas>
      <div id="status"></div>
    </div>
    <div id="strip" role="tablist" aria-label="เลือกวัน"></div>
  </div>

  <div class="stats">
    <div class="card"><div class="k" id="kNow">ตอนนี้</div><div class="v" id="vNow">--</div><div class="s">เมตร (MSL)</div></div>
    <div class="card hi"><div class="k">สูงสุด</div><div class="v" id="vHi">--</div><div class="s" id="sHi"></div></div>
    <div class="card lo"><div class="k">ต่ำสุด</div><div class="v" id="vLo">--</div><div class="s" id="sLo"></div></div>
  </div>
  <div class="tides" id="tides"></div>

  <footer>
    ข้อมูลพยากรณ์ระดับน้ำทะเลจาก <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    (โมเดลคลื่น DWD ICON) เป็นค่าจากแบบจำลอง ไม่ใช่ค่าวัดจริง และไม่เหมาะสำหรับการเดินเรือ<br>
    แตะ/ลากบนกราฟเพื่อดูระดับน้ำแต่ละชั่วโมง
  </footer>
</main>

<script>
"use strict";

// จุดวัด: พิกัดในทะเลใกล้ชายฝั่ง (แก้ไข/เพิ่มได้)
const STATIONS = [
  {n:"สมุทรปราการ (ปากน้ำ)", lat:13.45, lon:100.57},
  {n:"ชลบุรี (ศรีราชา)",      lat:13.12, lon:100.90},
  {n:"พัทยา",                 lat:12.90, lon:100.83},
  {n:"ระยอง",                 lat:12.62, lon:101.35},
  {n:"ตราด (แหลมงอบ)",        lat:12.10, lon:102.35},
  {n:"หัวหิน",                lat:12.55, lon:100.05},
  {n:"ประจวบคีรีขันธ์",        lat:11.80, lon: 99.85},
  {n:"ชุมพร",                 lat:10.50, lon: 99.35},
  {n:"สุราษฎร์ธานี (ดอนสัก)",  lat: 9.25, lon: 99.85},
  {n:"นครศรีธรรมราช",          lat: 8.35, lon:100.35},
  {n:"สงขลา",                 lat: 7.25, lon:100.65},
  {n:"ปัตตานี",               lat: 7.00, lon:101.35},
  {n:"นราธิวาส",              lat: 6.45, lon:102.00},
  {n:"ระนอง",                 lat: 9.90, lon: 98.40},
  {n:"พังงา",                 lat: 8.35, lon: 98.20},
  {n:"ภูเก็ต",                lat: 7.85, lon: 98.20},
  {n:"กระบี่ (อ่าวนาง)",       lat: 7.95, lon: 98.85},
  {n:"สตูล (ปากบารา)",         lat: 6.80, lon: 99.60},
];

const $ = id => document.getElementById(id);
const sel = $("station"), cv = $("cv"), ctx = cv.getContext("2d");
const TH_DAY = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const TH_MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

let stIdx = 0;
try { stIdx = Math.min(STATIONS.length-1, Math.max(0, parseInt(localStorage.getItem("st")||"0",10)||0)); } catch(e){}
let day = 0;
let D = null;            // {times:[ "YYYY-MM-DDTHH:MM" ], lvl:[...], gmin, gmax, fetched}
let loading = false;
let cursorX = null, cursorTimer = null;

STATIONS.forEach((s,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=s.n; sel.appendChild(o); });
sel.value = stIdx;

// ---------- data ----------
function cacheKey(i){ return "tide_v1_"+i; }

function parseResp(j){
  const t = j?.hourly?.time, v = j?.hourly?.sea_level_height_msl;
  if(!t || !v) throw new Error("no data");
  const n = Math.min(168, v.length);
  const lvl = new Array(n).fill(null);
  let valid = 0;
  for(let i=0;i<n;i++){ if(typeof v[i]==="number"){ lvl[i]=v[i]; valid++; } }
  if(!valid) throw new Error("no sea data here");
  let first = lvl.findIndex(x=>x!==null);
  for(let i=0;i<first;i++) lvl[i]=lvl[first];
  for(let i=first+1;i<n;i++) if(lvl[i]===null) lvl[i]=lvl[i-1];
  return {times:t.slice(0,n), lvl};
}

function finalize(d){
  let mn=Infinity, mx=-Infinity;
  d.lvl.forEach(x=>{ if(x<mn)mn=x; if(x>mx)mx=x; });
  if(mx-mn<0.3){ const m=(mx+mn)/2; mn=m-.15; mx=m+.15; }
  const pad=(mx-mn)*.08; d.gmin=mn-pad; d.gmax=mx+pad;
  return d;
}

async function load(i, force){
  loading = true; showStatus("กำลังโหลดข้อมูล…");
  let cached=null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey(i))||"null"); } catch(e){}
  const fresh = cached && (Date.now()-cached.fetched < 3*3600*1000);
  if(cached && fresh && !force){ D = finalize(cached); finish(); return; }
  try{
    const s = STATIONS[i];
    const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}&hourly=sea_level_height_msl&forecast_days=7&timezone=Asia%2FBangkok`;
    const r = await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = parseResp(await r.json());
    d.fetched = Date.now();
    try{ localStorage.setItem(cacheKey(i), JSON.stringify(d)); }catch(e){}
    D = finalize(d); finish();
  }catch(err){
    if(cached){ D = finalize(cached); finish("ออฟไลน์ — แสดงข้อมูลที่บันทึกไว้"); }
    else { D = null; loading=false; showStatus("โหลดข้อมูลไม่สำเร็จ ("+err.message+")\nแตะเพื่อลองใหม่", true); updateUI(); }
  }
}
function finish(note){ loading=false; showStatus(note||"", false, !!note); updateUI(); if(note) setTimeout(()=>showStatus(""),3500); }

function showStatus(msg, retry, soft){
  const el=$("status");
  el.style.display = msg ? "flex" : "none";
  el.style.whiteSpace="pre-line";
  el.style.background = soft ? "transparent" : "rgba(6,16,30,.75)";
  el.style.alignItems = soft ? "flex-end" : "center";
  el.style.pointerEvents = retry ? "auto" : "none";
  el.textContent = msg;
  el.onclick = retry ? ()=>load(stIdx,true) : null;
}

// ---------- helpers ----------
function levelAt(d, hpos){
  const i0 = d*24 + Math.floor(hpos), f = hpos - Math.floor(hpos);
  const L = D.lvl;
  if(i0 >= L.length-1) return L[L.length-1];
  return L[i0] + (L[i0+1]-L[i0])*f;
}
function nowHour(){ const n=new Date(); return n.getHours()+n.getMinutes()/60; }
function dayDate(d){
  const t = D?.times?.[d*24];
  if(t){ const [y,m,dd]=t.slice(0,10).split("-").map(Number); return new Date(y,m-1,dd); }
  const n=new Date(); n.setDate(n.getDate()+d); return n;
}
const f2 = v => (v>=0?"+":"−")+Math.abs(v).toFixed(2);
const hh = h => String(h).padStart(2,"0")+":00";

function dayStats(d){
  let mx=-Infinity,mn=Infinity,mxH=0,mnH=0,sum=0;
  for(let h=0;h<24;h++){ const v=D.lvl[d*24+h]; sum+=v; if(v>mx){mx=v;mxH=h;} if(v<mn){mn=v;mnH=h;} }
  return {mx,mn,mxH,mnH,avg:sum/24};
}
function turnings(d){
  const out=[], L=D.lvl;
  for(let h=0;h<24;h++){
    const i=d*24+h; if(i<1||i>=L.length-1) continue;
    const a=L[i-1], b=L[i], c=L[i+1];
    if(b>a && b>=c) out.push({h,v:b,hi:true});
    else if(b<a && b<=c) out.push({h,v:b,hi:false});
  }
  return out;
}

// ---------- UI ----------
function updateUI(){
  buildStrip();
  if(!D){ ["vNow","vHi","vLo"].forEach(i=>$(i).textContent="--"); $("sHi").textContent=$("sLo").textContent=""; $("tides").innerHTML=""; return; }

  const s = dayStats(day);
  if(day===0){ $("kNow").textContent="ตอนนี้"; $("vNow").textContent=f2(levelAt(0,nowHour())); }
  else { $("kNow").textContent="เฉลี่ยทั้งวัน"; $("vNow").textContent=f2(s.avg); }
  $("vHi").textContent=f2(s.mx); $("sHi").textContent="เวลา "+hh(s.mxH);
  $("vLo").textContent=f2(s.mn); $("sLo").textContent="เวลา "+hh(s.mnH);

  const t=$("tides"); t.innerHTML="";
  turnings(day).forEach(x=>{
    const c=document.createElement("span"); c.className="chip"+(x.hi?"":" l");
    c.innerHTML=(x.hi?"น้ำขึ้นสูงสุด ":"น้ำลงต่ำสุด ")+hh(x.h)+" <b>"+f2(x.v)+" ม.</b>";
    t.appendChild(c);
  });
}

sel.addEventListener("change", ()=>{ stIdx=+sel.value; day=0; try{localStorage.setItem("st",stIdx);}catch(e){} load(stIdx); });
function buildStrip(){
  const st=$("strip"); st.innerHTML="";
  for(let i=0;i<7;i++){
    const dt=dayDate(i), b=document.createElement("button");
    b.type="button"; b.className="dbtn"+(i===day?" on":""); b.setAttribute("role","tab"); b.setAttribute("aria-selected",i===day);
    b.innerHTML="<b>"+(i===0?"วันนี้":TH_DAY[dt.getDay()])+"</b><span>"+dt.getDate()+" "+TH_MON[dt.getMonth()]+"</span>";
    b.addEventListener("click",()=>{ day=i; cursorX=null; updateUI(); });
    st.appendChild(b);
  }
}

// ---------- canvas ----------
let W=0,H=0,dpr=1;
function resize(){
  const r=cv.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,3);
  W=Math.max(1,r.width); H=Math.max(1,r.height);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
}
new ResizeObserver(resize).observe(cv); resize();

function setCursor(e){
  const r=cv.getBoundingClientRect(); cursorX=Math.max(0,Math.min(W,e.clientX-r.left));
  clearTimeout(cursorTimer); cursorTimer=setTimeout(()=>cursorX=null,3000);
}
cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); setCursor(e); });
cv.addEventListener("pointermove",e=>{ if(e.buttons||e.pointerType==="mouse") setCursor(e); });

const WAVE=0;               // 0 = กราฟนิ่ง, 1 = ลูกคลื่นเคลื่อนไหว
const TOP=0.20, BOT=0.72;   // vertical range (fraction of H) the level maps to
function baseY(v){ const span=D.gmax-D.gmin; return H*(BOT-(v-D.gmin)/span*(BOT-TOP)); }

let phase=0, last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!document.hidden) { phase+=dt*2.2; draw(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0a1a31"); g.addColorStop(1,"#06101e");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(!D) return;

  // grid: hours
  ctx.strokeStyle="rgba(120,160,220,.14)"; ctx.lineWidth=1; ctx.fillStyle="rgba(190,210,245,.55)";
  ctx.font="11px system-ui,sans-serif"; ctx.textAlign="center";
  for(let h=0;h<=24;h+=6){ const x=Math.round(h/24*(W-1))+.5; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }

  // grid: levels
  ctx.textAlign="left";
  const steps=3;
  for(let k=0;k<=steps;k++){
    const v=D.gmin+(D.gmax-D.gmin)*k/steps, y=Math.round(baseY(v))+.5;
    ctx.beginPath(); ctx.setLineDash([3,5]); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillText(f2(v)+" ม.",6,y-3);
  }

  const N=Math.ceil(W/2)+1, sx=W/(N-1);
  const ys=new Array(N);
  for(let i=0;i<N;i++) ys[i]=baseY(levelAt(day,i/(N-1)*24));
  const amp=Math.max(2.5,H*0.012);

  function layer(off,a,k1,k2,sp,color,foam){
    ctx.beginPath(); ctx.moveTo(0,H);
    const pts=[];
    for(let i=0;i<N;i++){
      const x=i*sx;
      const y=ys[i]+off+WAVE*(a*Math.sin(i*k1+phase*sp)+a*0.55*Math.sin(i*k2-phase*sp*1.3));
      pts.push(y); ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H); ctx.closePath();
    ctx.fillStyle=color; ctx.fill();
    if(foam){
      ctx.beginPath(); pts.forEach((y,i)=>i?ctx.lineTo(i*sx,y):ctx.moveTo(0,y));
      ctx.strokeStyle="rgba(205,236,255,.9)"; ctx.lineWidth=2; ctx.stroke();
    }
    return pts;
  }
  if(WAVE) layer(-amp*2.6,amp,0.09,0.21,0.8,"rgba(28,84,156,.85)");
  const gr=ctx.createLinearGradient(0,H*TOP,0,H);
  gr.addColorStop(0,"rgba(40,150,245,.95)"); gr.addColorStop(1,"rgba(10,60,140,.97)");
  const front=layer(0,amp,0.075,0.17,1.0,gr,true);

  // hour labels
  ctx.fillStyle="rgba(225,240,255,.85)"; ctx.textAlign="center";
  ["00:00","06:00","12:00","18:00"].forEach((t,i)=>ctx.fillText(t,Math.min(W-22,Math.max(22,i*W/4+(i?0:22))),H-8));

  // now marker
  if(day===0){
    const x=nowHour()/24*W, i=Math.max(0,Math.min(N-1,Math.round(x/sx))), y=front[i];
    ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
    ctx.strokeStyle="#1e78dc"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,7.5,0,7); ctx.stroke();
  }

  // scrub cursor
  if(cursorX!==null){
    const hp=cursorX/W*24, v=levelAt(day,hp), i=Math.max(0,Math.min(N-1,Math.round(cursorX/sx)));
    ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cursorX,0); ctx.lineTo(cursorX,H); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cursorX,front[i],5,0,7); ctx.fill();
    const hr=Math.floor(hp), mi=Math.floor((hp-hr)*60);
    const label=String(hr).padStart(2,"0")+":"+String(mi).padStart(2,"0")+"  "+f2(v)+" ม.";
    ctx.font="600 13px system-ui,sans-serif"; const tw=ctx.measureText(label).width+18;
    const bx=Math.max(4,Math.min(W-tw-4,cursorX-tw/2)), by=Math.max(6,front[i]-44);
    ctx.fillStyle="rgba(6,16,30,.92)"; ctx.strokeStyle="#2d5fa0"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(bx,by,tw,26,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.fillText(label,bx+tw/2,by+17);
  }
}

// ---------- start ----------
load(stIdx);
setInterval(()=>{ if(!document.hidden && !loading && D && Date.now()-D.fetched>3*3600*1000) load(stIdx,true); },60000);
setInterval(()=>{ if(!document.hidden && D && day===0) updateUI(); },60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && D && day===0) updateUI(); });

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
